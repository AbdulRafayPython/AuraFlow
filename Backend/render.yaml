# Auraflow Backend — Render.com Blueprint
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: auraflow-backend
    runtime: python
    rootDir: Backend
    region: singapore
    plan: starter
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    envVars:
      # TiDB Serverless caps the cluster at 25 conns TOTAL across all
      # services (12 + 8 + 2 = 22, 3 spare). web: gevent greenlets share this pool.
      - key: DB_MAX_CONNECTIONS
        value: "12"
      - key: FLASK_ENV
        value: production
      - key: SOCKETIO_ASYNC_MODE
        value: gevent
      - key: DB_HOST
        sync: false    # set manually
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: FRONTEND_URL
        sync: false    # e.g. https://auraflow.vercel.app
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false    # e.g. rediss://:password@host:6379
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false

  - type: worker
    name: auraflow-celery-worker
    runtime: python
    rootDir: Backend
    region: singapore
    plan: starter
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: python -m celery -A celery_app worker --loglevel=info --pool=gevent --concurrency=50 -Q default,high_priority,periodic
    envVars:
      # TiDB Serverless caps the cluster at 25 conns TOTAL across all
      # services (12 + 8 + 2 = 22, 3 spare). worker: --concurrency=50 greenlets share this pool.
      - key: DB_MAX_CONNECTIONS
        value: "8"
      - key: FLASK_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET_KEY
        fromService:
          name: auraflow-backend
          type: web
          envVarKey: JWT_SECRET_KEY
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: REDIS_URL
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false

  - type: worker
    name: auraflow-celery-beat
    runtime: python
    rootDir: Backend
    region: singapore
    plan: starter
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: python -m celery -A celery_app beat --loglevel=info
    envVars:
      # TiDB Serverless caps the cluster at 25 conns TOTAL across all
      # services (12 + 8 + 2 = 22, 3 spare). beat: only enqueues, barely touches the DB.
      - key: DB_MAX_CONNECTIONS
        value: "2"
      - key: FLASK_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET_KEY
        fromService:
          name: auraflow-backend
          type: web
          envVarKey: JWT_SECRET_KEY
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: REDIS_URL
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
